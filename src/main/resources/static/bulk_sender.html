<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Notification Sender | Stress Test</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }

        .container {
            width: 100%;
            max-width: 600px;
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            background-color: rgba(17, 25, 40, 0.75);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.125);
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 1px;
            color: #00d2ff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 0.9em;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fff;
            font-size: 1em;
            outline: none;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            border-color: #00d2ff;
            background: rgba(255, 255, 255, 0.1);
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #ff416c 0%, #ff4b2b 100%);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 20px;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .progress-container {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            height: 10px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: #00d2ff;
            width: 0%;
            transition: width 0.1s;
        }

        .status-text {
            text-align: center;
            margin-top: 10px;
            font-size: 0.9em;
            color: #888;
        }

        .log-area {
            margin-top: 20px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 6px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85em;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚀 Bulk Notification Sender</h2>
        
        <div class="form-group">
            <label for="messageCount">Number of Messages</label>
            <input type="number" id="messageCount" value="50" min="1" max="1000">
        </div>

        <div class="form-group">
            <label for="messageTemplate">Message Template</label>
            <input type="text" id="messageTemplate" value="Load Test Notification #{i}">
            <small style="color: #666; font-size: 0.8em;">Use {i} for auto-increment number</small>
        </div>

        <div class="form-group">
            <label for="priority">Priority</label>
            <select id="priority">
                <option value="NORMAL">Normal (Batched)</option>
                <option value="CRITICAL">Critical (Instant)</option>
                <option value="INFO">Info (Batched)</option>
                <option value="WARNING">Warning (Instant)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="targetUser">Target User (Optional)</label>
            <input type="text" id="targetUser" placeholder="Leave empty for Broadcast">
        </div>

        <button onclick="startAttack()" id="attackBtn">🔥 Start Flood</button>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="status-text" id="statusText">Ready</div>

        <div class="log-area" id="logArea"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api';

        async function startAttack() {
            const count = parseInt(document.getElementById('messageCount').value);
            const template = document.getElementById('messageTemplate').value;
            const priority = document.getElementById('priority').value;
            const user = document.getElementById('targetUser').value;
            
            const btn = document.getElementById('attackBtn');
            const progressBar = document.getElementById('progressBar');
            const progressContainer = document.getElementById('progressContainer');
            const statusText = document.getElementById('statusText');
            const logArea = document.getElementById('logArea');

            // Reset UI
            btn.disabled = true;
            btn.innerText = "Sending...";
            progressContainer.style.display = 'block';
            logArea.style.display = 'block';
            progressBar.style.width = '0%';
            logArea.innerHTML = '';

            let sent = 0;
            let errors = 0;

            log("Starting batch of " + count + " messages...");

            for (let i = 1; i <= count; i++) {
                const message = template.replace('{i}', i);
                const payload = { message, priority, username: user || null };

                try {
                    const response = await fetch(`${API_URL}/notifications/send`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        sent++;
                    } else {
                        errors++;
                        log(`Error sending #${i}: ${response.status}`);
                    }
                } catch (e) {
                    errors++;
                    log(`Network Error #${i}: ${e.message}`);
                }

                // Update Progress
                const percent = (i / count) * 100;
                progressBar.style.width = percent + '%';
                statusText.innerText = `Sent: ${sent} | Errors: ${errors} | Remaining: ${count - i}`;

                // Scroll log
                logArea.scrollTop = logArea.scrollHeight;

                // Small delay to prevent complete browser freeze if number is huge
                if(i % 10 === 0) await new Promise(r => setTimeout(r, 10));
            }

            log("Batch completed!");
            btn.disabled = false;
            btn.innerText = "🔥 Start Flood";
            statusText.innerText = "Done. Check Admin/User Portal.";
        }

        function log(msg) {
            const logArea = document.getElementById('logArea');
            logArea.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
        }
    </script>
</body>
</html>
