spring.application.name=real-time-notification

# Server
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Javid@123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# H2 fallback (optional)
# spring.datasource.url=jdbc:h2:mem:notification_db
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=password
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true

# Message Queue Configuration (RabbitMQ)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Fast failure to reduce fallback latency when broker is unavailable
spring.rabbitmq.connection-timeout=1500ms

# Consumer tuning to improve queue mode throughput and latency
spring.rabbitmq.listener.simple.concurrency=4
spring.rabbitmq.listener.simple.max-concurrency=12
spring.rabbitmq.listener.simple.prefetch=50

# Retry Configuration
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10000ms

# Queue-mode latency tuning
notification.batch.flush-interval-ms=300

# RabbitMQ circuit-breaker/health probe tuning
notification.rabbitmq.circuit.open-duration-ms=10000
notification.rabbitmq.health.probe-interval-ms=3000

# Bulk-delivery mode: keep limiter off by default to allow full-volume tests.
notification.rate-limit.enabled=false
notification.rate-limit.min-interval-ms=50

# Direct mode (RabbitMQ OFF) degradation simulation for existing-system differentiation.
# High priority still always delivers; NORMAL/INFO are probabilistic.
notification.direct-mode.degraded.enabled=true
notification.direct-mode.degraded.normal-delivery-rate=0.75
notification.direct-mode.degraded.info-delivery-rate=0.50

# WebSocket
# No specific properties needed for basic setup, handled in config class

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.datavalley=DEBUG
